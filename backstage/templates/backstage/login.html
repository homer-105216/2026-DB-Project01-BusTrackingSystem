<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者登入 · 公車營運中心</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/backstage-login.css') }}">
</head>
<body>
    <main class="login-card">
        <div class="brand">▥ 公車營運中心</div>
        <div class="eyebrow">GROUP 07 / 後台管理</div>
        <h1>管理者登入</h1>
        <p class="intro">請使用具有管理者權限的會員帳號登入。</p>
        {% if error_message %}<div class="error" role="alert">{{ error_message }}</div>{% endif %}
        <form method="post" action="{{ url_for('backstage.login') }}">
            <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
            <input type="hidden" name="next" value="{{ next_path }}">
            <label for="identifier">使用者名稱或 Email</label>
            <input id="identifier" name="identifier" type="text" autocomplete="username" maxlength="100" value="{{ identifier }}" required autofocus>
            <label for="password">密碼</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="255" required>
            <button type="submit">登入後台</button>
        </form>
        <p class="note">僅具管理者權限的帳號可進入後台。登入有效時間為 8 小時，逾時請重新登入。</p>
        <a class="return" href="{{ url_for('frontstage.index') }}">← 返回乘客首頁</a>
    </main>
</body>
</html>
