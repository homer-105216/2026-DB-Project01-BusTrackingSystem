{% extends 'base.html' %}
{% block title %}營運管理中心 · 公車追蹤系統{% endblock %}
{% block head %}
<style>
:root{--navy:#102c38;--teal:#007f76;--line:#dce5e7;--muted:#657981}*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#19333e;font:15px 'Segoe UI','Microsoft JhengHei',sans-serif}body>header,body>footer{display:none}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}a{color:inherit}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#d7e5e9;padding:30px 20px;position:sticky;top:0;height:100vh}.brand{font-size:22px;color:white;font-weight:750;margin:0 10px 32px}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#82b9bd;margin-top:8px}.group{font-size:11px;letter-spacing:2px;color:#86a5ad;margin:24px 12px 10px}.sidebar a{display:block;text-decoration:none;padding:11px 13px;border-radius:7px;margin:3px 0}.sidebar a:hover,.sidebar a.active{background:#24515a;color:white}.sidebar a.active{border-left:3px solid #58d9b8}.return{border-top:1px solid #36505a;margin-top:24px;padding-top:12px}.workspace{min-width:0;padding:28px 40px 50px}.topbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:20px}.tag{background:#d9eee6;color:#25664c;border-radius:20px;padding:6px 12px}.notice{padding:12px 16px;background:#fff5da;border:1px solid #edddb0;border-radius:8px;font-size:13px;margin:22px 0;color:#775b23}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:26px 0}h1{font-size:29px;letter-spacing:-1px;margin:0 0 9px}h2{font-size:18px;margin:0 0 20px}p{color:var(--muted);line-height:1.7;margin:0}.eyebrow{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:9px}.btn{border:1px solid var(--line);background:white;padding:10px 17px;border-radius:7px;cursor:pointer;color:#24444d}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn:hover{filter:brightness(.94)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}.card,.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:22px}.card .number{font-size:33px;font-weight:700;margin:12px 0}.card small{color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}input,select{border:1px solid #cbd8dc;padding:10px 12px;border-radius:6px;background:white;color:#19333e;max-width:100%}.toolbar input{min-width:230px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}th{text-align:left;background:#f3f7f8;color:var(--muted);font-size:12px;padding:14px 12px}td{padding:17px 12px;border-bottom:1px solid #e8eeef}td button{border:0;background:transparent;cursor:pointer;color:var(--teal);padding:5px 9px}.danger{color:#b64141!important}.pill{background:#e3f2ec;border-radius:20px;padding:5px 10px;color:#247653;font-size:12px}.foot{margin-top:18px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.grid-two{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quick a{padding:18px;border:1px solid var(--line);border-radius:8px;text-decoration:none}.quick a:hover{border-color:var(--teal);background:#f1faf7}.bar-row{display:grid;grid-template-columns:90px 1fr 40px;gap:12px;align-items:center;margin:21px 0}.bar-track{background:#edf3f2;border-radius:5px;height:13px}.bar{height:13px;background:var(--teal);border-radius:5px}.empty{text-align:center;padding:40px;color:var(--muted)}dialog{width:560px;max-width:94vw;border:0;border-radius:13px;padding:28px;box-shadow:0 20px 80px #102c3840}dialog::backdrop{background:#102c3870}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:flex;flex-direction:column;gap:8px;font-size:13px}label input,label select{width:100%}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.feedback{color:#ae3434;margin-top:14px}#toast{position:fixed;bottom:25px;right:25px;background:var(--navy);color:white;padding:14px 22px;border-radius:8px;z-index:5}.count{color:var(--muted);font-size:13px}.filters-label{font-size:13px;color:var(--muted)}@media(max-width:1100px){.workspace{padding:25px}.cards{grid-template-columns:repeat(2,1fr)}.grid-two{grid-template-columns:1fr}}@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:18px}.brand{margin-bottom:15px}.sidebar nav{display:flex;gap:5px;flex-wrap:wrap}.sidebar nav .group{width:100%;margin:8px}.sidebar a{font-size:13px;padding:8px}.return{display:none}.workspace{padding:18px}.heading{align-items:flex-start;flex-wrap:wrap}.cards{gap:10px}.card{padding:15px}.form-grid{grid-template-columns:1fr}.topbar{gap:10px}.quick{grid-template-columns:1fr}}

.route-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.route-choice{text-align:left;width:100%;background:white;border:1px solid var(--line);border-radius:10px;padding:24px;cursor:pointer;color:var(--navy)}
.route-choice:hover{border-color:var(--teal);background:#f1faf7}.route-choice strong{display:block;font-size:21px;margin:10px 0}.route-choice span{display:block;color:var(--muted);font-size:13px;line-height:1.8}
.route-detail-heading{margin:22px 0}.direction-tabs{display:flex;gap:10px;margin:20px 0}.direction-tabs .selected{background:var(--teal);color:white;border-color:var(--teal)}
.stop-list{list-style:none;margin:0;padding:0}.stop-item{display:flex;align-items:center;gap:18px;padding:18px 0;position:relative}.stop-item:not(:last-child):before{content:'';position:absolute;left:19px;top:50px;bottom:-10px;width:2px;background:#c9dfdc}.stop-number{position:relative;z-index:1;display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#e1f1ed;color:var(--teal);font-weight:700}.stop-info{flex:1;min-width:0}.stop-info strong{display:block;font-size:17px}.stop-info small{color:var(--muted)}.stop-actions{display:flex;gap:8px}.stop-actions button{padding:8px 12px}
@media(max-width:700px){.route-cards{grid-template-columns:1fr}.stop-item{flex-wrap:wrap}.stop-actions{margin-left:58px}.toolbar input{min-width:0;width:100%}}
</style>
{% endblock %}
{% block content %}
<div class="shell"><aside class="sidebar"><div class="brand">▥ 公車營運中心<small>BUS OPERATIONS / GROUP 07</small></div><nav id="nav"></nav><div class="return"><a href="{{ url_for('frontstage.index') }}">← 返回乘客首頁</a></div></aside><section class="workspace"><div class="topbar"><span>公車追蹤系統 / 後台管理</span><span class="tag">介面展示模式</span></div><div class="notice">示範資料 · 操作僅儲存在此瀏覽器，不會修改 PostgreSQL。統計依示範資料計算。</div><div class="heading"><div><div class="eyebrow" id="section-name"></div><h1 id="title"></h1><p id="description"></p></div><button class="btn primary" id="add" hidden>＋ 新增資料</button></div><div id="content"></div></section></div>
<dialog id="editor"><form id="form"><h2 id="form-title"></h2><div class="form-grid" id="fields"></div><p class="feedback" id="error" role="alert"></p><div class="actions"><button type="button" class="btn" id="cancel">取消</button><button type="submit" class="btn primary">儲存示範資料</button></div></form></dialog><div id="toast" role="status" hidden></div>
{% endblock %}
{% block scripts %}
<script>
const page={{ page|tojson }},base={{ url_for('backstage.index')|tojson }};
// 欄位對應組內關聯綱目；SQL 尚未提供，目前以瀏覽器資料展示操作。
const configs={
routes:{title:'路線管理',group:'CMS / 資料管理',desc:'維護路線名稱與起訖站，建立公車服務的基礎資料。',fields:[['routeId','路線編號'],['routeName','路線名稱'],['origin','起點'],['destination','終點']]},
stations:{title:'站點管理',group:'CMS / 資料管理',desc:'維護站牌名稱、地址與地理座標。',fields:[['stationId','站點編號'],['sName','站點名稱'],['address','地址'],['sLatitude','緯度','number'],['sLongitude','經度','number']]},
stops:{title:'路線站序與去返程',group:'CMS / 資料管理',desc:'先選擇路線，再查看與設定去程、返程的停靠站順序。',fields:[['routeId','路線','ref:routes:routeId:routeName'],['stationId','站點','ref:stations:stationId:sName'],['rDirection','行駛方向','select:去程,返程'],['stopSequence','站序','positive']]},
'bus-types':{title:'車型管理',group:'CMS / 資料管理',desc:'管理 Bus_Type 車型與載客容量，供車輛資料選用。',fields:[['busType','車型名稱'],['capacity','載客容量','positive']]},
buses:{title:'車輛管理',group:'SCHEDULE / 班表調度',desc:'維護車輛編號及車型，容量由所屬車型決定。',fields:[['bId','車輛編號'],['busType','車型','ref:bus-types:busType:busType']]},
trips:{title:'預定班次管理',group:'SCHEDULE / 班表調度',desc:'設定路線的固定發車時間與行駛方向。',fields:[['tId','班次編號'],['routeId','路線','ref:routes:routeId:routeName'],['departureTime','發車時間','time'],['tDirection','行駛方向','select:去程,返程']]},
dispatch:{title:'每日派車與司機安排',group:'SCHEDULE / 班表調度',desc:'為每日班次指派車輛、司機，並維護執行狀態。',fields:[['tId','預定班次','ref:trips:tId:tId'],['date','執行日期','date'],['driver','司機'],['status','執行狀態','select:未發車,執行中,已完成,已取消'],['bId','車輛','ref:buses:bId:bId']]},
'stop-times':{title:'各站預計到離站時間',group:'SCHEDULE / 班表調度',desc:'依班次設定各停靠站預計到站及離站時間。',fields:[['tId','班次','ref:trips:tId:tId'],['stationId','站點','ref:stations:stationId:sName'],['expArrivalTime','預計到站','time'],['expDepartureTime','預計離站','time']]}
};
const seeds={routes:[['R001','紅線 01','高雄車站','中山大學'],['R002','藍線 02','左營高鐵站','美麗島站']],stations:[['S001','高雄車站','高雄市三民區建國二路',22.639,120.302],['S002','美麗島站','高雄市新興區中山一路',22.631,120.301],['S003','中山大學','高雄市鼓山區蓮海路70號',22.626,120.266]],stops:[['R001','S001','去程',1],['R001','S002','去程',2],['R001','S003','去程',3],['R001','S003','返程',1],['R001','S001','返程',2]],'bus-types':[['電動低地板公車',40],['大型柴油公車',45]],buses:[['BUS-001','電動低地板公車'],['BUS-002','大型柴油公車']],trips:[['T001','R001','08:00','去程'],['T002','R001','09:00','返程'],['T003','R002','08:30','去程']],dispatch:[['T001','2026-11-04','王大明','已完成','BUS-001'],['T002','2026-11-04','陳小華','未發車','BUS-001'],['T003','2026-11-04','林志明','執行中','BUS-002']],'stop-times':[['T001','S001','08:00','08:00'],['T001','S002','08:12','08:13'],['T001','S003','08:35','08:35']]};
let db;try{db=JSON.parse(localStorage.getItem('bus-backstage-demo-v1'))}catch{}if(!db||!Object.keys(configs).every(k=>Array.isArray(db[k])))db=Object.fromEntries(Object.entries(seeds).map(([k,rows])=>[k,rows.map(row=>Object.fromEntries(configs[k].fields.map((f,i)=>[f[0],row[i]])))]));
const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=k=>k==='overview'?base:base+k;
el('nav').innerHTML=`<a class="${page==='overview'?'active':''}" href="${url('overview')}">◫ 營運總覽</a>`+['CMS / 資料管理','SCHEDULE / 班表調度'].map(g=>`<div class="group">${g}</div>`+Object.entries(configs).filter(([k,c])=>c.group===g).map(([k,c])=>`<a class="${page===k?'active':''}" href="${url(k)}">${c.title}</a>`).join('')).join('')+`<div class="group">ANALYSIS / 統計分析</div><a class="${page==='analysis'?'active':''}" href="${url('analysis')}">營運統計分析</a>`;
function toast(message){el('toast').textContent=message;el('toast').hidden=false;setTimeout(()=>el('toast').hidden=true,3000)}
function save(){try{localStorage.setItem('bus-backstage-demo-v1',JSON.stringify(db));return true}catch{toast('瀏覽器無法儲存資料，請確認儲存空間與權限。');return false}}
function cards(items){return '<div class="cards">'+items.map(([label,n,note])=>`<div class="card"><p>${label}</p><div class="number">${n}</div><small>${note}</small></div>`).join('')+'</div>'}
function bars(items){const max=Math.max(1,...items.map(x=>x[1]));return items.map(([name,n])=>`<div class="bar-row"><span>${esc(name)}</span><div class="bar-track"><div class="bar" style="width:${n/max*100}%"></div></div><strong>${n}</strong></div>`).join('')||'<div class="empty">尚無資料</div>'}
function summary(){return cards([['服務路線',db.routes.length,'已建立的路線'],['營運站點',db.stations.length,'可供路線設定使用'],['車隊規模',db.buses.length,`${db['bus-types'].length} 種車型`],['預定班次',db.trips.length,'固定發車班次']])}
if(page==='overview'){el('section-name').textContent='OPERATIONS / 營運總覽';el('title').textContent='每一班，都有條理。';el('description').textContent='從基礎資料到每日調度，在這裡掌握公車營運。';el('content').innerHTML=summary()+`<div class="grid-two"><div class="panel"><h2>快速開始</h2><div class="quick">${['routes','bus-types','trips','dispatch'].map(k=>`<a href="${url(k)}"><strong>${configs[k].title} →</strong><p>${configs[k].desc}</p></a>`).join('')}</div></div><div class="panel"><h2>各路線預定班次</h2>${bars(db.routes.map(r=>[r.routeName,db.trips.filter(t=>t.routeId===r.routeId).length]))}</div></div>`}
let query='',direction='',route='',day='',editing=-1;
function display(k,v){const f=configs[page].fields.find(f=>f[0]===k);if(f?.[2]?.startsWith('ref:')){const [,table,id,label]=f[2].split(':');const row=db[table].find(r=>String(r[id])===String(v));return row?`${v} · ${row[label]}`:v}return v}

// 站序頁先選路線，再依方向顯示站點；保留原始索引供編輯與刪除。
function renderStops(){
    el('add').hidden=!route;
    const search=el('search');
    search.placeholder=route?'搜尋站點編號或名稱…':'搜尋路線編號或名稱…';
    search.setAttribute('aria-label',route?'搜尋站點':'搜尋路線');
    if(!route){
        const routes=db.routes.filter(r=>[r.routeId,r.routeName,r.origin,r.destination].some(v=>String(v).toLowerCase().includes(query.toLowerCase())));
        el('table').innerHTML='<div class="route-cards">'+routes.map(r=>`<button class="route-choice" data-route="${esc(r.routeId)}"><span>${esc(r.routeId)}</span><strong>${esc(r.routeName)}</strong><span>${esc(r.origin)} → ${esc(r.destination)}</span><span>查看站點與順序 →</span></button>`).join('')+'</div>'+(routes.length?'':'<div class="empty">沒有符合條件的路線，請調整搜尋或先到路線管理新增路線。</div>');
        el('total').textContent=`共 ${routes.length} 條路線`;
        return;
    }
    const selected=db.routes.find(r=>r.routeId===route);
    const all=db.stops.map((r,i)=>({r,i})).filter(({r})=>r.routeId===route&&r.rDirection===direction).sort((a,b)=>Number(a.r.stopSequence)-Number(b.r.stopSequence));
    const rows=all.filter(({r})=>{const station=db.stations.find(s=>s.stationId===r.stationId);return [r.stationId,station?.sName].some(v=>String(v??'').toLowerCase().includes(query.toLowerCase()))});
    el('table').innerHTML=`<button class="btn" data-back>← 返回路線清單</button><div class="route-detail-heading"><h2>${esc(selected?.routeName??route)}</h2><p>${esc(selected?.origin)} → ${esc(selected?.destination)}</p></div><div class="direction-tabs" aria-label="行駛方向">${['去程','返程'].map(d=>`<button class="btn ${direction===d?'selected':''}" aria-pressed="${direction===d}" data-direction="${d}">${d}</button>`).join('')}</div><ol class="stop-list">${rows.map(({r,i})=>{const station=db.stations.find(s=>s.stationId===r.stationId);return `<li class="stop-item"><span class="stop-number" aria-label="站序 ${esc(r.stopSequence)}">${esc(r.stopSequence)}</span><div class="stop-info"><strong>${esc(station?.sName??r.stationId)}</strong><small>${esc(r.stationId)}</small></div><div class="stop-actions"><button class="btn" data-edit="${i}">編輯</button><button class="btn danger" data-delete="${i}">刪除</button></div></li>`}).join('')}</ol>${rows.length?'':`<div class="empty">${query?'沒有符合條件的站點。':'此方向尚未設定站點，請點右上角「新增站序」。'}</div>`}`;
    el('total').textContent=`${direction}：顯示 ${rows.length} 站 / 共 ${all.length} 站`;
}

function renderTable(){if(page==='stops'){renderStops();return}const c=configs[page];const rows=db[page].map((r,i)=>({r,i})).filter(({r})=>(!query||Object.values(r).some(v=>String(v).toLowerCase().includes(query.toLowerCase())))&&(!direction||(r.rDirection??r.tDirection)===direction)&&(!route||r.routeId===route)&&(!day||r.date===day));el('table').innerHTML=`<table><thead><tr>${c.fields.map(f=>`<th scope="col">${f[1]}</th>`).join('')}<th scope="col">操作</th></tr></thead><tbody>${rows.map(({r,i})=>`<tr>${c.fields.map(([k])=>`<td>${k==='status'?`<span class="pill">${esc(r[k])}</span>`:esc(display(k,r[k]))}</td>`).join('')}<td><button data-edit="${i}">編輯</button><button class="danger" data-delete="${i}">刪除</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">沒有符合條件的資料，請調整搜尋或新增資料。</div>'}`;el('total').textContent=`顯示 ${rows.length} 筆 / 共 ${db[page].length} 筆`}
function openEditor(i=-1){editing=i;const c=configs[page],row=i<0?(page==='stops'?{routeId:route,rDirection:direction,stopSequence:Math.max(0,...db.stops.filter(r=>r.routeId===route&&r.rDirection===direction).map(r=>Number(r.stopSequence)))+1}:{}):db[page][i];el('form-title').textContent=(i<0?'新增':'編輯')+' · '+c.title;el('error').textContent='';el('fields').innerHTML=c.fields.map(([k,label,type='text'])=>{let input;if(type.startsWith('ref:')){const [,table,id,name]=type.split(':');input=`<select name="${k}" required><option value="">請選擇</option>${db[table].filter(r=>!(page==='stops'&&k==='routeId')||r[id]===route).map(r=>`<option value="${esc(r[id])}" ${String(row[k])===String(r[id])?'selected':''}>${esc(r[id])} · ${esc(r[name])}</option>`).join('')}</select>`}else if(type.startsWith('select:'))input=`<select name="${k}">${type.slice(7).split(',').map(v=>`<option ${row[k]===v?'selected':''}>${v}</option>`).join('')}</select>`;else input=`<input name="${k}" type="${type==='positive'?'number':type}" ${type==='positive'?'min="1" step="1"':type==='number'?'step="any"':''} value="${esc(row[k]??'')}" required maxlength="160">`;return `<label>${label}${input}</label>`}).join('');el('editor').showModal()}
function validate(row){const keys={routes:['routeId'],stations:['stationId'],'bus-types':['busType'],buses:['bId'],trips:['tId'],stops:['routeId','stationId','rDirection'],dispatch:['tId','date'],'stop-times':['tId','stationId']}[page];if(db[page].some((r,i)=>i!==editing&&keys.every(k=>String(r[k])===String(row[k]))))return '此編號或組合已存在，請使用不同資料。';if(page==='stations'&&(Math.abs(Number(row.sLatitude))>90||Math.abs(Number(row.sLongitude))>180))return '緯度需介於 -90～90，經度需介於 -180～180。';if(page==='stops'&&db.stops.some((r,i)=>i!==editing&&r.routeId===row.routeId&&r.rDirection===row.rDirection&&Number(r.stopSequence)===Number(row.stopSequence)))return '同一路線與方向的站序不可重複。';if(page==='stop-times'){const trip=db.trips.find(t=>t.tId===row.tId);if(!db.stops.some(s=>s.routeId===trip?.routeId&&s.rDirection===trip?.tDirection&&s.stationId===row.stationId))return '此站點不在該班次路線的對應方向中。';if(row.expDepartureTime<row.expArrivalTime)return '此示範表單不支援跨日時間，離站時間需晚於或等於到站時間。'}return ''}
if(configs[page]){const c=configs[page];el('section-name').textContent=c.group;el('title').textContent=c.title;el('description').textContent=c.desc;el('add').hidden=false;el('add').textContent='＋ 新增'+({'bus-types':'車型',routes:'路線',stations:'站點',stops:'站序',buses:'車輛',trips:'班次',dispatch:'派車','stop-times':'到離站時間'}[page]);el('content').innerHTML=`<div class="panel"><div class="toolbar"><input id="search" aria-label="搜尋資料" placeholder="搜尋編號、名稱或其他欄位…">${page!=='stops'&&c.fields.some(f=>f[0]==='routeId')?`<select id="route-filter" aria-label="篩選路線"><option value="">所有路線</option>${db.routes.map(r=>`<option value="${esc(r.routeId)}">${esc(r.routeName)}</option>`).join('')}</select>`:''}${page!=='stops'&&c.fields.some(f=>['rDirection','tDirection'].includes(f[0]))?'<select id="direction" aria-label="篩選方向"><option value="">所有方向</option><option>去程</option><option>返程</option></select>':''}${page==='dispatch'?'<label>執行日期<input type="date" id="day"></label>':''}</div><div id="table" class="table-wrap"></div><div class="foot"><span id="total"></span><span>示範資料 · 本機儲存</span></div></div>`;renderTable();el('search').oninput=e=>{query=e.target.value;renderTable()};if(el('direction'))el('direction').onchange=e=>{direction=e.target.value;renderTable()};if(el('route-filter'))el('route-filter').onchange=e=>{route=e.target.value;renderTable()};if(el('day'))el('day').onchange=e=>{day=e.target.value;renderTable()};el('add').onclick=()=>openEditor();el('table').onclick=e=>{
const action=e.target.closest('button');if(!action)return;
if(page==='stops'){
if(action.hasAttribute('data-route')){route=action.dataset.route;direction='去程';query='';el('search').value='';renderTable();return}
if(action.hasAttribute('data-back')){route='';direction='';query='';el('search').value='';renderTable();return}
if(action.hasAttribute('data-direction')){direction=action.dataset.direction;query='';el('search').value='';renderTable();return}
}
if(e.target.dataset.edit!==undefined)openEditor(Number(e.target.dataset.edit));if(e.target.dataset.delete!==undefined){const i=Number(e.target.dataset.delete);const r=db[page][i];const dependencies={routes:[['trips','routeId'],['stops','routeId']],stations:[['stops','stationId'],['stop-times','stationId']],'bus-types':[['buses','busType']],buses:[['dispatch','bId']],trips:[['dispatch','tId'],['stop-times','tId']]};if((dependencies[page]||[]).some(([table,k])=>db[table].some(x=>x[k]===r[k]))){toast('此資料仍被使用，請先移除相關設定。');return}if(confirm('確定刪除此筆示範資料？')){const previous=db[page].slice();db[page].splice(i,1);if(!save()){db[page]=previous;return}renderTable();toast('已刪除示範資料')}}};}
el('cancel').onclick=()=>el('editor').close();el('form').onsubmit=e=>{e.preventDefault();const row=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,v.trim()]));if(Object.values(row).some(v=>!v)){el('error').textContent='請填寫所有欄位。';return}const error=validate(row);if(error){el('error').textContent=error;return}if(editing>=0){const old=db[page][editing];const key={routes:'routeId',stations:'stationId','bus-types':'busType',buses:'bId',trips:'tId'}[page];if(key&&old[key]!==row[key]){el('error').textContent='編輯時請保留原編號／車型名稱，以維持關聯資料一致。';return}}
const previous=db[page].slice();if(editing<0)db[page].push(row);else db[page][editing]=row;if(!save()){db[page]=previous;return}el('editor').close();renderTable();toast('已儲存示範資料')};
if(page==='analysis'){el('section-name').textContent='ANALYSIS / 統計分析';el('title').textContent='營運統計分析';el('description').textContent='以日期區間檢視實際派班，掌握各路線、車輛與執行狀態。';el('content').innerHTML=`<div class="toolbar"><label>開始日期<input id="from" type="date"></label><label>結束日期<input id="to" type="date"></label><button id="clear" class="btn">清除日期</button></div><p id="analysis-error" role="alert"></p><div id="stats"></div><div class="grid-two"><div class="panel"><h2>各路線每日派班數</h2><div id="route-chart"></div></div><div class="panel"><h2>執行狀態分布</h2><div id="status-chart"></div></div><div class="panel"><h2>車輛派班次數</h2><div id="bus-chart"></div></div><div class="panel"><h2>各路線預定班次數</h2><p>固定班表總數，不受日期篩選影響。</p>${bars(db.routes.map(r=>[r.routeName,db.trips.filter(t=>t.routeId===r.routeId).length]))}</div></div>`;function analyze(){const from=el('from').value,to=el('to').value;el('analysis-error').textContent=from&&to&&from>to?'開始日期不得晚於結束日期。':'';const rows=db.dispatch.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to));el('stats').innerHTML=cards([['區間派班',rows.length,'依執行日期計算'],['已完成',rows.filter(r=>r.status==='已完成').length,'完成的班次'],['執行中',rows.filter(r=>r.status==='執行中').length,'行駛中的班次'],['已取消',rows.filter(r=>r.status==='已取消').length,'取消的班次']]);el('route-chart').innerHTML=bars(db.routes.map(r=>[r.routeName,rows.filter(d=>db.trips.find(t=>t.tId===d.tId)?.routeId===r.routeId).length]));el('status-chart').innerHTML=bars(['未發車','執行中','已完成','已取消'].map(s=>[s,rows.filter(r=>r.status===s).length]));el('bus-chart').innerHTML=bars(db.buses.map(b=>[b.bId,rows.filter(r=>r.bId===b.bId).length]))}el('from').onchange=el('to').onchange=analyze;el('clear').onclick=()=>{el('from').value=el('to').value='';analyze()};analyze()}
</script>
